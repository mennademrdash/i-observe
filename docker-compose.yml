# All credentials come from .env (gitignored). Nothing sensitive is inlined here.
services:
  postgres:
    # postgres:16-alpine was corrupt on this machine (entrypoint: "exec format error");
    # 17-alpine is the tag the machine's existing containers run successfully.
    image: postgres:17-alpine
    container_name: iobserve-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 5433 on the host: 5432 is already used by the machine's own PostgreSQL 18 service.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iobserve-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # OPTIONAL, opt-in only: `docker compose --profile minio up -d minio`.
    # MinIO is archived upstream: Docker Hub returns "pull access denied", quay.io returns
    # 401 and dl.min.io returns HTTP 410 Gone. It must never block the normal demo startup,
    # so it lives behind a profile and is excluded from the default `up`.
    # The default S3-compatible endpoint is the moto server on :9000 (see start_iobserve.ps1).
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: iobserve-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
